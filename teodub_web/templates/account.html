{% extends 'base.html' %}
{% block content %}<section class="card account-card"><span class="eyebrow">TÀI KHOẢN CỦA BẠN</span><h1>Đổi mật khẩu</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Mật khẩu mới<input type="password" name="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><label>Nhập lại mật khẩu mới<input type="password" name="confirm" minlength="12" maxlength="128" autocomplete="new-password" required></label><p class="form-note">Ít nhất 12 ký tự. Sau khi đổi, các phiên cũ sẽ đăng xuất.</p><button class="primary">Lưu mật khẩu mới</button></form></section>{% endblock %}
